services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-specforge}
      POSTGRES_USER: ${POSTGRES_USER:-specforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-specforge_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-specforge} -d ${POSTGRES_DB:-specforge}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      FRONTEND_ORIGINS: http://localhost:8080,http://localhost:5173
      DATABASE_URL: postgresql://${POSTGRES_USER:-specforge}:${POSTGRES_PASSWORD:-specforge_local}@db:5432/${POSTGRES_DB:-specforge}?schema=public
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-180000}
      OLLAMA_MAX_RETRIES: ${OLLAMA_MAX_RETRIES:-1}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"
volumes:
  postgres_data:
